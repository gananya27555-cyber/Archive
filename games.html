    <style>
        body {

        .page-heading {
            text-align: center;
            margin: 40px 0;
            color: #26354a;
            font-family: Georgia, serif;
        }

        .shelf {
    display: flex;
    justify-content: space-evenly;
    align-items: flex-end;
    gap: 20px;
    max-width: 1100px;
    min-height: 310px;
    margin: 40px auto;
    padding: 35px 15px 0;
    background: #e8dfd1;
    border-bottom: 16px solid #806044;
    box-shadow: 0 5px 8px rgba(0,0,0,0.15);
}

        .game {
            width: 170px;
            text-align: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: #26354a;
        }

        .game img {
            width: 150px;
            height: 210px;
            object-fit: cover;
            box-shadow: 3px 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .game img:hover {
            transform: translateY(-8px);
        }

        .game p {
            font-family: Georgia, serif;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .shelf {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
