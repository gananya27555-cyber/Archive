
<!DOCTYPE html>

    <style>
        body {
            background-color: #f5f2eb;
        }

        .shelf-heading {
            text-align: center;
            margin: 40px 0;
        }

        .shelf-heading h1 {
            font-family: Georgia, serif;
            color: #26354a;
        }

        .bookshelf {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            padding: 30px 25px 15px;
            margin: 30px auto;
            max-width: 1200px;
            height: 330px;
            background: #e8dfd1;
            border-bottom: 18px solid #806044;
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .show {
            width: 17%;
            max-width: 175px;
            height: 250px;
            display: block;
            transition: transform 0.3s;
        }

        .show img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 3px 4px 8px rgba(0,0,0,0.25);
        }

        .show:hover {
            transform: translateY(-12px);
        }

        @media (max-width: 750px) {
            .bookshelf {
                height: auto;
                flex-wrap: wrap;
            }

            .show {
                width: 28%;
            }
        }
        .show-filters {
    text-align: center;
    margin: 20px auto 35px;
}

.show-filters button {
    padding: 10px 18px;
    margin: 5px;
    border: 1px solid #806044;
    background: #e8dfd1;
    color: #26354a;
    font-family: Georgia, serif;
    cursor: pointer;
    transition: 0.3s;
}

.show-filters button:hover,
.show-filters button.active {
    background: #26354a;
    color: white;
}

.show.hidden {
    display: none;
}
    </style>
</head>

<script>
function filterShows(genre, button) {

    var shows = document.querySelectorAll(".show");

    shows.forEach(function(show) {

        if (genre === "all" ||
            show.getAttribute("data-genre") === genre) {

            show.classList.remove("hidden");

        } else {

            show.classList.add("hidden");

        }

    });

    var buttons = document.querySelectorAll(".show-filters button");

    buttons.forEach(function(btn) {
        btn.classList.remove("active");
    });

    button.classList.add("active");
}
</script>
