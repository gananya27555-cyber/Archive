
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Archive | Movie Details</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f5f2eb;
        }

        /* NAVIGATION */

        body > header.detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px 35px;
        }

        .detail-header nav {
            display: flex;
            gap: 25px;
        }

        .detail-header nav a {
            text-decoration: none;
            color: #202020;
        }

        /* MOVIE COLLECTION INTRO */

        .movie-intro {
            max-width: 1100px;
            margin: 75px auto 45px;
            padding: 0 25px;
        }

        .movie-intro .eyebrow {
            color: #806044;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .movie-intro h1 {
            font-family: Georgia, serif;
            font-size: 55px;
            color: #182b59;
            margin-bottom: 15px;
        }

        .movie-intro .subtitle {
            font-family: Georgia, serif;
            font-size: 19px;
            color: #665d52;
        }

        /* MOVIE DETAILS */

        .movie-container {
            display: flex;
            gap: 45px;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 70px;
            padding: 35px;
            background: #e8dfd1;
            border: 1px solid #c5b69f;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .movie-container img {
            width: 280px;
            height: 390px;
            object-fit: cover;
            display: block;
            box-shadow: 5px 6px 12px rgba(0,0,0,0.2);
        }

        .movie-info {
            flex: 1;
        }

        .movie-info h2 {
            color: #182b59;
            font-family: Georgia, serif;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .movie-info p {
            line-height: 1.7;
            color: #514638;
            margin: 14px 0;
        }

        .shelf-button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #182b59;
            color: white;
            border: none;
            cursor: pointer;
            font-family: Georgia, serif;
            font-size: 15px;
        }

        .shelf-button:hover {
            background: #806044;
        }

        /* REVIEWS */

        .review-section {
            max-width: 850px;
            margin: 50px auto 80px;
            padding: 30px;
            background: #e8dfd1;
            border: 1px solid #c5b69f;
        }

        .review-section h2 {
            color: #182b59;
            font-family: Georgia, serif;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .review-section p {
            color: #514638;
            margin: 12px 0;
        }

        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            width: fit-content;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 30px;
            color: #aaa;
            cursor: pointer;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #c28b35;
        }

        .review-section textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            background: #f5f2eb;
            border: 1px solid #b9a78e;
            font-family: inherit;
        }

        .review-submit {
            padding: 11px 24px;
            background: #182b59;
            color: white;
            border: none;
            cursor: pointer;
        }

        .saved-review {
            border-top: 1px solid #c9b99f;
            padding: 15px 0;
        }

        #message {
            margin-top: 12px;
            color: #182b59;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            body > header.detail-header {
                padding: 15px;
            }

            .movie-intro {
                margin: 45px auto 30px;
            }

            .movie-intro h1 {
                font-size: 38px;
            }

            .movie-container {
                flex-direction: column;
                margin: 20px 15px 45px;
                padding: 20px;
            }

            .movie-container img {
                width: 220px;
                height: 310px;
            }

            .movie-info h2 {
                font-size: 30px;
            }

            .review-section {
                margin: 25px 15px;
                padding: 20px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVIGATION -->

    <header class="detail-header">

        <div class="logo">The Archive</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="my-shelf.html">My Shelf</a>
        </nav>

        <a href="signin.html" class="signin-link">Sign In</a>

    </header>


    <!-- MOVIE COLLECTION INTRO -->

    <section class="movie-intro">

        <p class="eyebrow">THE ARCHIVE / MOVIE COLLECTION</p>

        <h1># Inside the Movie.</h1>

        <p class="subtitle">
            A little more about the story.
        </p>

    </section>


    <!-- MOVIE DETAILS -->

    <main class="movie-container">

        <img id="cover" src="" alt="Movie Poster">

        <div class="movie-info">

            <h2 id="title"></h2>

            <p id="director"></p>

            <p id="genre"></p>

            <p id="year"></p>

            <p id="description"></p>

            <button
                class="shelf-button"
                id="saveButton"
                onclick="saveToShelf()">

                + Add to My Shelf

            </button>

        </div>

    </main>


    <!-- VIEWER REVIEWS -->

    <section class="review-section">

        <h2>Viewer's Corner.</h2>

        <p>Watched this movie? Share your thoughts.</p>

        <form id="reviewForm">

            <p>Your Rating</p>

            <div class="stars">

                <input type="radio" name="rating" id="star5" value="5">
                <label for="star5">★</label>

                <input type="radio" name="rating" id="star4" value="4">
                <label for="star4">★</label>

                <input type="radio" name="rating" id="star3" value="3">
                <label for="star3">★</label>

                <input type="radio" name="rating" id="star2" value="2">
                <label for="star2">★</label>

                <input type="radio" name="rating" id="star1" value="1">
                <label for="star1">★</label>

            </div>

            <p>Your Review</p>

            <textarea
                id="review"
                rows="5"
                placeholder="What did you think about this movie?">
            </textarea>

            <button class="review-submit" type="submit">
                Submit Review
            </button>

            <p id="message"></p>

        </form>

        <div id="reviewDisplay"></div>

    </section>


    <footer>
        THE ARCHIVE. — A place for everything worth remembering.
    </footer>


    <script src="movie-details.js"></script>

</body>
</html>
