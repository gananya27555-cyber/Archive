    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f5f2eb;
        }

        .shelf-heading {
            text-align: center;
            margin: 40px 0;
        }

        .shelf-heading h1 {
            font-family: Georgia, serif;
            color: #26354a;
        }

        .bookshelf {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            padding: 30px 25px 15px;
            margin: 30px auto;
            max-width: 1200px;
            height: 330px;
            background: #e8dfd1;
            border-bottom: 18px solid #806044;
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .anime {
            width: 17%;
            max-width: 175px;
            height: 250px;
            display: block;
            transition: transform 0.3s;
        }

        .anime img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 3px 4px 8px rgba(0,0,0,0.25);
        }

        .anime:hover {
            transform: translateY(-12px);
        }

        @media (max-width: 750px) {
            .bookshelf {
                height: auto;
                flex-wrap: wrap;
            }

            .anime {
                width: 28%;
            }
        }
    </style>
</head>
