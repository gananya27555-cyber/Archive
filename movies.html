    <style>
        body {
            background-color: #f5f2eb;
        }

        .shelf-heading {
            text-align: center;
            margin: 40px 0;
        }

        .shelf-heading h1 {
            font-family: Georgia, serif;
            color: #26354a;
        }

        .bookshelf {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            padding: 30px 25px 15px;
            margin: 30px auto;
            max-width: 1200px;
            height: 330px;
            background: #e8dfd1;
            border-bottom: 18px solid #806044;
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .movie {
            width: 17%;
            max-width: 175px;
            height: 250px;
            display: block;
            transition: transform 0.3s;
        }

        .movie img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 3px 4px 8px rgba(0,0,0,0.25);
        }

        .movie:hover {
            transform: translateY(-12px);
        }

        @media (max-width: 750px) {
            .bookshelf {
                height: auto;
                flex-wrap: wrap;
            }

            .movie {
                width: 28%;
            }
        }
       .movie-filters {
    text-align: center;
    margin: 20px auto 35px;
}

.movie-filters button {
    padding: 10px 18px;
    margin: 5px;
    border: 1px solid #806044;
    background: #e8dfd1;
    color: #26354a;
    font-family: Georgia, serif;
    cursor: pointer;
    transition: 0.3s;
}

.movie-filters button:hover,
.movie-filters button.active {
    background: #26354a;
    color: white;
}

.movie.hidden {
    display: none;
} 
    </style>
</head>

<script>
function filterMovies(genre, button) {

    var movies = document.querySelectorAll(".movie");

    movies.forEach(function(movie) {

        if (genre === "all" ||
            movie.getAttribute("data-genre") === genre) {

            movie.classList.remove("hidden");

        } else {

            movie.classList.add("hidden");

        }

    });

    var buttons = document.querySelectorAll(".movie-filters button");

    buttons.forEach(function(btn) {
        btn.classList.remove("active");
    });

    button.classList.add("active");
}
</script>
